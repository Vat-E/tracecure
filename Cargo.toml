[workspace]
resolver = "2"
members = [
    "crates/tracecure-core",
    "crates/tracecure-api",
    "crates/tracecure-server",
    "crates/tracecure-cli",
    "crates/tracecure-storage",
]
# ui/tracecure-ui is excluded from the workspace because it builds for wasm32
# and has incompatible target features with the server binaries.
exclude = ["ui/tracecure-ui", "bench/format-fit"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/tracecure-dev/tracecure"

[workspace.dependencies]
tracecure-core = { path = "crates/tracecure-core" }
tracecure-api  = { path = "crates/tracecure-api" }
tracecure-storage = { path = "crates/tracecure-storage" }

tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
arrow = { version = "55", features = ["prettyprint"] }
parquet = { version = "55", features = ["arrow", "zstd", "async"] }
bincode = "1"
arc-swap = "1"
crc32fast = "1"

clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

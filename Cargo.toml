[workspace]
resolver = "2"
members = [
    "crates/sift-core",
    "crates/sift-api",
    "crates/sift-server",
    "crates/sift-cli",
]
# ui/sift-ui is excluded from the workspace because it builds for wasm32
# and has incompatible target features with the server binaries.
exclude = ["ui/sift-ui"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/sift-dev/sift"

[workspace.dependencies]
sift-core = { path = "crates/sift-core" }
sift-api  = { path = "crates/sift-api" }

tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "format-fit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sift-core = { path = "../../crates/sift-core" }

arrow = { version = "55", features = ["prettyprint"] }
parquet = { version = "55", features = ["arrow", "zstd", "async"] }

chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
serde_json = "1"

rand = "0.8"
rand_chacha = "0.3"

clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

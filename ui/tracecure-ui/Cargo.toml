[package]
name = "tracecure-ui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "tracecure_ui"
path = "src/lib.rs"

[[bin]]
name = "tracecure-ui"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = "0.1"
console_log = { version = "1", features = ["color"] }
futures = "0.3.32"
gloo-net = { version = "0.7", features = ["http", "websocket"] }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracecure-api = { path = "../../crates/tracecure-api" }
tracecure-core = { path = "../../crates/tracecure-core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlInputElement",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "Event",
    "KeyboardEvent",
    "BinaryType",
    "History",
    "Location",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Url",
    "UrlSearchParams",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

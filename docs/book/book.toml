[book]
title = "Tracecure"
description = "Self-hosted, Rust-native log platform — user and integration documentation."
authors = ["Tracecure contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/tracecure-dev/tracecure"
edit-url-template = "https://github.com/tracecure-dev/tracecure/edit/main/docs/book/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
